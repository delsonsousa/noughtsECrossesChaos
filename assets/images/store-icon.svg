<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FF2E97"/>
      <stop offset="42%" stop-color="#E95B32"/>
      <stop offset="78%" stop-color="#D9B900"/>
      <stop offset="100%" stop-color="#D5C000"/>
